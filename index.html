<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Jogo da Memória Consumo Consciente</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: título no topo, placar em uma faixa, mesa de 4x3 cartas no centro, dica do par abaixo, banco de figuras no fim. */
:root{
  --bg:#fbfaf3; --surface:#ffffff; --fg:#2f4a52; --muted:#5f7a80;
  --blue:#5aa6d6; --green:#7dbb6a; --pink:#ee8f9b; --yellow:#e9b93c;
  --line:#dfe9e2; --back1:#8fc9e8; --back2:#a9d99a; --ok:#3f8f4f; --bad:#d9534f;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17272c; --surface:#213840; --fg:#eaf4f1; --muted:#a9c2c2;
  --blue:#7cc0ea; --green:#98d486; --pink:#f5a3ad; --yellow:#f2cb5c;
  --line:#34525a; --back1:#3d7fa3; --back2:#4f8f55; --ok:#98d486; --bad:#ff8a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17272c; --surface:#213840; --fg:#eaf4f1; --muted:#a9c2c2;
  --blue:#7cc0ea; --green:#98d486; --pink:#f5a3ad; --yellow:#f2cb5c;
  --line:#34525a; --back1:#3d7fa3; --back2:#4f8f55; --ok:#98d486; --bad:#ff8a80; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.4}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:20px 32px;display:flex;flex-direction:column;gap:16px}

header{text-align:center;display:flex;flex-direction:column;gap:0}
h1{font-family:var(--display);font-weight:800;font-size:clamp(2rem,7vw,3.4rem);line-height:1;margin:0;color:var(--blue);letter-spacing:.02em;text-wrap:balance}
.sub{font-family:var(--display);font-weight:800;font-size:clamp(1.2rem,4.2vw,2rem);color:var(--green);letter-spacing:.04em;line-height:1.1}
.escola{font-weight:800;text-transform:uppercase;letter-spacing:.12em;font-size:.85rem;color:var(--muted);margin-bottom:6px}
footer{text-align:center;font-weight:700;color:var(--muted);border-top:2px solid var(--line);padding-top:14px}
.how{color:var(--muted);font-weight:700;margin:6px 0 0}

.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center}
.stat{background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:6px 16px;font-weight:800;font-variant-numeric:tabular-nums;display:flex;gap:8px;align-items:baseline}
.stat small{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800}
.stat.turn{border-color:var(--yellow)}
.stat.low{border-color:var(--bad);color:var(--bad);animation:pulsa .5s ease infinite alternate}
@keyframes pulsa{to{transform:scale(1.08)}}
.seg{display:flex;flex-wrap:wrap;justify-content:center;border:2px solid var(--line);border-radius:22px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;color:var(--fg);font:800 .95rem var(--body);padding:8px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--blue);color:#10262e}
.btn{border:0;border-radius:999px;background:var(--pink);color:#3a1218;font:800 1rem var(--body);padding:10px 20px;cursor:pointer}
.btn.ghost{background:var(--surface);color:var(--fg);border:2px solid var(--line);padding:8px 16px}
button:focus-visible,summary:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}

.board{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(8px,1.8vw,16px)}
@media (max-width:540px){.board{grid-template-columns:repeat(3,1fr)}}
.card{aspect-ratio:420/340;border:0;padding:0;background:none;cursor:pointer;perspective:800px;border-radius:14px;min-width:0}
.inner{position:relative;display:block;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.card.open .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;box-shadow:0 2px 0 var(--line)}
.back{background:
  radial-gradient(circle at 25% 25%,var(--back2) 0 9%,transparent 10%) 0 0/34px 34px,
  radial-gradient(circle at 75% 75%,var(--surface) 0 6%,transparent 7%) 0 0/34px 34px,
  var(--back1);
  display:grid;place-items:center;border:4px solid var(--surface)}
.back span{font-family:var(--display);font-weight:800;font-size:clamp(1.6rem,6vw,3rem);color:var(--blue);background:var(--surface);width:1.7em;height:1.7em;border-radius:50%;display:grid;place-items:center;line-height:1}
.front{transform:rotateY(180deg);background:#fff}
.front img,.front svg,.g img,.g svg{width:100%;height:100%;object-fit:cover;display:block;font-family:var(--body)}
.card.done{cursor:default}
.card.done .face{box-shadow:0 0 0 4px var(--ok)}
.card.miss .face{box-shadow:0 0 0 4px var(--bad)}
.card.hit .inner{animation:pop .6s ease}
.card.miss .inner{animation:shake .45s ease}
@keyframes pop{0%{transform:rotateY(180deg) scale(1)}35%{transform:rotateY(180deg) scale(1.13) rotate(-3deg)}65%{transform:rotateY(180deg) scale(.97) rotate(2deg)}100%{transform:rotateY(180deg) scale(1)}}
@keyframes shake{0%,100%{transform:rotateY(180deg) translateX(0)}20%{transform:rotateY(180deg) translateX(-8px)}40%{transform:rotateY(180deg) translateX(8px)}60%{transform:rotateY(180deg) translateX(-6px)}80%{transform:rotateY(180deg) translateX(6px)}}
.card:not(.open):hover .inner{transform:translateY(-3px)}

.tip{font-size:1.1rem;background:var(--surface);border:2px dashed var(--green);border-radius:16px;padding:12px 16px;text-align:center;font-weight:700;min-height:3.4em;display:grid;place-items:center}
.tip b{color:var(--ok)}
.tip.bad{border-color:var(--bad)}
.tip.good{border-style:solid}
.win{background:var(--surface);border:3px solid var(--yellow);border-radius:20px;padding:20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;animation:sobe .5s ease}
@keyframes sobe{from{transform:scale(.9);opacity:.3}to{transform:none;opacity:1}}
.win h2{font-family:var(--display);font-weight:800;font-size:clamp(1.6rem,5vw,2.4rem);margin:0;color:var(--pink);line-height:1.1}
.win p{margin:0;font-weight:700}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:10}

details{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:10px 16px}
summary{cursor:pointer;font-weight:800}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding-block:12px 4px}
.g{aspect-ratio:420/340;border-radius:12px;overflow:hidden;background:#fff}
@media (prefers-reduced-motion:reduce){.inner{transition:none}.card.hit .inner,.card.miss .inner,.win,.stat.low{animation:none}}
</style>

</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <pattern id="pat" width="64" height="64" patternUnits="userSpaceOnUse">
    <g fill="none" stroke-width="5" stroke-linecap="round" opacity=".55">
      <path d="M6 18a12 12 0 0 1 22 0" stroke="#fff"/>
      <path d="M38 50a11 11 0 0 0 20 0" stroke="#8ec5e6"/>
      <circle cx="48" cy="14" r="6" stroke="#9fd08c"/>
      <path d="M10 44c6-6 6 8 12 2" stroke="#f5a9b4"/>
    </g>
  </pattern>
</defs></svg>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="wrap">
  <header>
    <div class="escola">Colégio Santa Catarina - CSC</div>
    <h1>Jogo da Memória</h1>
    <div class="sub">Consumo Consciente</div>
    <p class="how" id="how">Vire duas cartas por vez e encontre os pares iguais.</p>
  </header>

  <div class="bar">
    <div class="seg" role="group" aria-label="Modo de jogo">
      <button id="modo1" type="button" aria-pressed="true">1 jogador</button>
      <button id="modo2" type="button" aria-pressed="false">2 jogadores</button>
      <button id="modoT" type="button" aria-pressed="false">Contra o tempo</button>
    </div>
    <div class="stat"><small>Pares</small><span id="pares">0/6</span></div>
    <div class="stat" id="boxJogadas"><small>Jogadas</small><span id="jogadas">0</span></div>
    <div class="stat" id="boxTempo"><small>Tempo</small><span id="tempo">0:00</span></div>
    <div class="stat" id="boxRecorde" hidden><small>Recorde</small><span id="recorde">0</span></div>
    <div class="stat turn" id="boxVez" hidden><small>Vez</small><span id="vez">Jogador 1</span></div>
    <div class="stat" id="boxPlacar" hidden><small>Placar</small><span id="placar">0 x 0</span></div>
    <button class="btn ghost" id="som" type="button" aria-pressed="true">Som: ligado</button>
    <button class="btn" id="novo" type="button">Novo jogo</button>
  </div>

  <div class="win" id="win" hidden>
    <h2 id="winTitle">Parabéns!</h2>
    <p id="winText"></p>
    <button class="btn" id="novo2" type="button">Jogar de novo</button>
  </div>

  <div class="board" id="board"></div>
  <div class="tip" id="tip" aria-live="polite"></div>

  <details>
    <summary id="galTitulo">Banco de figuras</summary>
    <div class="gal" id="gal"></div>
  </details>
  <footer>6ºA :: Integrantes do Grupo: Beatriz Antunes, Miguel Costa, Pedro Alan, Pedro David</footer>
</div>

   art:`<circle cx="100" cy="88" r="56" fill="#eef3f5" stroke="#c9d3d8" stroke-width="4"/><circle cx="100" cy="88" r="36" fill="#fff" stroke="#dbe4e8" stroke-width="3"/><path d="M14 36v24a9 9 0 0 0 18 0V36M23 36v112" stroke="#9fb0ba" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M184 148V32c-12 10-14 42-10 62h10" stroke="#9fb0ba" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M100 68l6 14 14 6-14 6-6 14-6-14-14-6 14-6z" fill="#fbd96b"/>`},
  {nome:"Doar Brinquedos", sub:"Trocar e Doar", cor:"amarelo", dica:"O brinquedo que você não usa mais pode alegrar outra criança, sem comprar um novo.",
   art:`<g fill="#d9a77e"><circle cx="72" cy="34" r="15"/><circle cx="128" cy="34" r="15"/><ellipse cx="100" cy="128" rx="38" ry="36"/><ellipse cx="58" cy="112" rx="13" ry="20" transform="rotate(25 58 112)"/><ellipse cx="142" cy="112" rx="13" ry="20" transform="rotate(-25 142 112)"/><circle cx="100" cy="62" r="36"/></g><circle cx="72" cy="34" r="7" fill="#fcd9de"/><circle cx="128" cy="34" r="7" fill="#fcd9de"/><ellipse cx="100" cy="74" rx="15" ry="11" fill="#f3dcc6"/><circle cx="86" cy="56" r="4" fill="#4a5560"/><circle cx="114" cy="56" r="4" fill="#4a5560"/><ellipse cx="100" cy="70" rx="5" ry="3.5" fill="#4a5560"/><path d="M100 146c-16-10-18-24-8-27 5-1 8 3 8 6 0-3 3-7 8-6 10 3 8 17-8 27z" fill="#e67f92"/>`},
  {nome:"Caneca Própria", sub:"Sem Descartáveis", cor:"rosa", dica:"Sua caneca é lavada e usada de novo, então nenhum copo descartável vai para o lixo.",
   art:`<path d="M136 80h14a22 22 0 0 1 0 44h-14" stroke="#f5a9b4" stroke-width="12" fill="none"/><rect x="54" y="60" width="84" height="98" rx="14" fill="#f5a9b4"/>${LEAF(96,128,15,0,"#fff")}<path d="M78 46c-8-10 8-14 0-26M100 46c-8-10 8-14 0-26M122 46c-8-10 8-14 0-26" stroke="#c9d3d8" stroke-width="4" fill="none" stroke-linecap="round"/>`},
  {nome:"Descartar Pilhas", sub:"Ponto de Coleta", cor:"verde", dica:"Pilha no lixo comum suja a terra e a água. No ponto de coleta ela é tratada do jeito certo.",
   art:`<rect x="88" y="12" width="24" height="18" rx="4" fill="#9fb0ba"/><rect x="68" y="26" width="64" height="134" rx="12" fill="#5b6770"/><path d="M68 70h64v78a12 12 0 0 1-12 12H80a12 12 0 0 1-12-12z" fill="#9fd08c"/><path d="M92 48h16M100 40v16" stroke="#fff" stroke-width="5" stroke-linecap="round"/><path d="M90 142h20" stroke="#fff" stroke-width="5" stroke-linecap="round"/><path d="M105 82l-16 24h11l-5 18 16-24h-11z" fill="#fbd96b"/>`},
  {nome:"Luz Natural", sub:"Abrir a Janela", cor:"amarelo", dica:"De dia, a luz do Sol ilumina de graça. Abrir a janela deixa a lâmpada descansar.",
   art:`<rect x="38" y="14" width="124" height="138" rx="8" fill="#c69a78"/><rect x="48" y="24" width="104" height="118" fill="#cfe8f6"/><circle cx="126" cy="50" r="16" fill="#fbd96b"/><path d="M48 142L112 62l40 18v62z" fill="#fff0b8" opacity=".85"/><path d="M100 24v118M48 83h104" stroke="#c69a78" stroke-width="7"/><rect x="30" y="148" width="140" height="11" rx="5.5" fill="#a9785a"/>`},
  {nome:"Trocar Livros", sub:"Emprestar e Doar", cor:"azul", dica:"Um livro trocado ou emprestado é lido por muita gente, sem gastar papel de novo.",
   art:`${LIVRO(30,124,140,"#6aaed6")}${LIVRO(44,92,118,"#f5a9b4")}${LIVRO(36,60,128,"#9fd08c")}<path d="M100 48c-16-10-18-24-8-27 5-1 8 3 8 6 0-3 3-7 8-6 10 3 8 17-8 27z" fill="#e67f92"/>`},
  {nome:"Balde e Esponja", sub:"Lavar sem Mangueira", cor:"azul", dica:"A mangueira gasta muita água. Com o balde você usa só o que precisa.",
   art:`<path d="M48 66A46 46 0 0 1 140 66" stroke="#9fb0ba" stroke-width="5" fill="none"/><path d="M48 66H140L127 156H61Z" fill="#8ec5e6"/><ellipse cx="94" cy="66" rx="46" ry="10" fill="#cfe8f6"/><rect x="142" y="128" width="46" height="28" rx="8" fill="#fbd96b"/><circle cx="154" cy="138" r="3" fill="#eebc3c"/><circle cx="168" cy="146" r="3" fill="#eebc3c"/><circle cx="178" cy="136" r="3" fill="#eebc3c"/><g fill="none" stroke="#8ec5e6" stroke-width="3"><circle cx="166" cy="104" r="10"/><circle cx="184" cy="84" r="6"/><circle cx="20" cy="120" r="7"/></g>`}
];

function frente(t, lado){
  if (t.fotos) return '<img alt="" src="' + IMG[t.fotos[lado]] + '">';
  const c = COR[t.cor];
  return `<svg viewBox="0 0 420 340" aria-hidden="true"><rect width="420" height="340" fill="${c.borda}"/><rect width="420" height="340" fill="url(#pat)"/><rect x="20" y="20" width="380" height="300" rx="34" fill="#fff"/><g transform="translate(95,24) scale(1.15)">${t.art}</g><text x="210" y="258" text-anchor="middle" font-size="30" font-weight="800" fill="${c.txt}">${t.nome}</text><text x="210" y="294" text-anchor="middle" font-size="23" font-weight="700" fill="${c.txt}">${t.sub}</text></svg>`;
}

const $ = id => document.getElementById(id);
const board = $("board");
let modo = "1", abertas = [], travado = false, achados = 0, naMesa = 0, jogadas = 0, vez = 0, pontos = [0,0];
let inicio = 0, relogio = null, partida = 0, acabou = false, ultimos = [], ultimoSeg = -1, recorde = 0;
try { recorde = Number(localStorage.getItem("memoria-recorde-tempo")) || 0; } catch (e) {}

// ---- Som (sintetizado, sem arquivos) ----
let som = true, ac = null;
function nota(f, t, d, tipo, v, f2){
  if (!som) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === "suspended") ac.resume();
    const o = ac.createOscillator(), g = ac.createGain(), t0 = ac.currentTime + t;
    o.type = tipo || "triangle"; o.frequency.setValueAtTime(f, t0);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + d);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(v || 0.18, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    o.connect(g); g.connect(ac.destination); o.start(t0); o.stop(t0 + d + 0.05);
  } catch (e) {}
}
const sons = {
  vira: () => nota(520, 0, 0.08, "triangle", 0.1),
  acerto: () => { nota(659, 0, 0.15); nota(988, 0.12, 0.35); },
  erro: () => { nota(220, 0, 0.18, "sawtooth", 0.08, 150); nota(165, 0.17, 0.3, "sawtooth", 0.08, 110); },
  vitoria: () => [523, 659, 784, 1047, 784, 1047].forEach((f, i) => nota(f, i * 0.14, i === 5 ? 0.7 : 0.2, "triangle", 0.2)),
  tique: () => nota(880, 0, 0.06, "square", 0.05),
  mesa: () => [784, 988, 1175].forEach((f, i) => nota(f, i * 0.09, 0.18)),
  fimTempo: () => [784, 622, 494, 392].forEach((f, i) => nota(f, i * 0.2, i === 3 ? 0.7 : 0.25, "triangle", 0.2))
};

// ---- Confete ----
const cv = $("fx"), cx = cv.getContext("2d");
const CORES = ["#5aa6d6", "#7dbb6a", "#ee8f9b", "#e9b93c", "#b79be0", "#ffffff"];
const reduz = matchMedia("(prefers-reduced-motion: reduce)").matches;
let ps = [], raf = 0;
function confete(x, y, n, chuva){
  if (reduz) return;
  for (let k = 0; k < n; k++) ps.push({
    x: chuva ? Math.random() * innerWidth : x, y: chuva ? -Math.random() * innerHeight * 0.7 : y,
    vx: (Math.random() - 0.5) * (chuva ? 3 : 10), vy: chuva ? Math.random() * 2 + 1.5 : -Math.random() * 7 - 2,
    g: chuva ? 0.03 : 0.3, s: Math.random() * 7 + 5, c: CORES[k % CORES.length],
    r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4, vida: chuva ? 320 : 55
  });
  if (!raf) raf = requestAnimationFrame(anima);
}
function anima(){
  if (cv.width !== innerWidth || cv.height !== innerHeight) { cv.width = innerWidth; cv.height = innerHeight; }
  cx.clearRect(0, 0, cv.width, cv.height);
  ps = ps.filter(p => p.vida > 0 && p.y < cv.height + 20);
  for (const p of ps) {
    p.vy += p.g; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.vida--;
    cx.save(); cx.globalAlpha = Math.min(1, p.vida / 20); cx.translate(p.x, p.y); cx.rotate(p.r);
    cx.fillStyle = p.c; cx.fillRect(-p.s / 2, -p.s / 3, p.s, p.s * 0.66); cx.restore();
  }
  raf = ps.length ? requestAnimationFrame(anima) : 0;
}
function centro(el){ const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; }

// ---- Jogo ----
function fmt(s){ return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); }
function passados(){ return inicio ? Math.floor((Date.now()-inicio)/1000) : 0; }
function restante(){ return Math.max(0, LIMITE - passados()); }
function embaralha(a){ for (let i = a.length-1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }

function pinta(){
  const T = modo === "tempo", dois = modo === "2";
  $("pares").textContent = T ? achados : achados + "/6";
  $("jogadas").textContent = jogadas;
  $("tempo").textContent = fmt(T ? restante() : passados());
  $("boxTempo").classList.toggle("low", T && inicio > 0 && !acabou && restante() <= 10);
  $("recorde").textContent = recorde;
  $("vez").textContent = "Jogador " + (vez+1);
  $("placar").textContent = pontos[0] + " x " + pontos[1];
  $("boxVez").hidden = !dois; $("boxPlacar").hidden = !dois;
  $("boxJogadas").hidden = dois || T; $("boxTempo").hidden = dois; $("boxRecorde").hidden = !T;
  $("modo1").setAttribute("aria-pressed", String(modo === "1"));
  $("modo2").setAttribute("aria-pressed", String(dois));
  $("modoT").setAttribute("aria-pressed", String(T));
}

function tique(){
  if (modo === "tempo" && inicio && !acabou) {
    const r = restante();
    if (r <= 10 && r > 0 && r !== ultimoSeg) { ultimoSeg = r; sons.tique(); }
    if (r <= 0) { pinta(); return fim(); }
  }
  pinta();
}

function novo(){
  clearInterval(relogio); relogio = null; inicio = 0; partida++; acabou = false; ultimoSeg = -1;
  achados = 0; jogadas = 0; vez = 0; pontos = [0,0]; ps = [];
  $("win").hidden = true; $("tip").className = "tip";
  $("tip").textContent = "Cada par mostra uma atitude que ajuda o planeta. Qual você já pratica?";
  $("how").textContent = modo === "tempo"
    ? "Você tem " + LIMITE + " segundos. Ache o máximo de pares; ao limpar a mesa, chegam novas figuras."
    : "Vire duas cartas por vez e encontre os pares iguais.";
  mesa();
}

// Sorteia 6 temas do banco, evitando os da mesa anterior.
function mesa(){
  abertas = []; travado = false; naMesa = 0;
  const livres = BANCO.map((_, i) => i).filter(i => !ultimos.includes(i));
  ultimos = embaralha(livres).slice(0, 6);
  const cartas = embaralha(ultimos.flatMap(t => [{t, lado:0}, {t, lado:1}]));
  board.innerHTML = "";
  cartas.forEach((c, i) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "card"; b.dataset.par = c.t;
    b.setAttribute("aria-label", "Carta " + (i+1) + ", virada para baixo");
    b.innerHTML = '<span class="inner"><span class="face back"><span>?</span></span><span class="face front">' + frente(BANCO[c.t], c.lado) + '</span></span>';
    b.addEventListener("click", () => vira(b, i));
    board.appendChild(b);
  });
  pinta();
}

function vira(b, i){
  if (travado || acabou || b.classList.contains("open")) return;
  if (!inicio) { inicio = Date.now(); relogio = setInterval(tique, 250); }
  b.classList.add("open"); sons.vira();
  b.setAttribute("aria-label", "Carta " + (i+1) + ": " + BANCO[b.dataset.par].nome);
  abertas.push({b, i});
  if (abertas.length < 2) return;
  jogadas++;
  const [x, y] = abertas; abertas = [];
  const p0 = partida, vale = () => p0 === partida && !acabou;
  if (x.b.dataset.par === y.b.dataset.par) {
    x.b.classList.add("done"); y.b.classList.add("done");
    achados++; naMesa++; pontos[vez]++;
    const p = BANCO[x.b.dataset.par], limpou = naMesa === 6;
    if (limpou) travado = true;
    setTimeout(() => {
      if (!vale()) return;
      sons.acerto();
      [x, y].forEach(c => { c.b.classList.add("hit"); confete(...centro(c.b), 18); });
      $("tip").className = "tip good";
      $("tip").innerHTML = "<span><b>Acertou! " + p.nome + ".</b> " + p.dica + "</span>";
    }, 380);
    pinta();
    if (limpou) setTimeout(() => {
      if (!vale()) return;
      if (modo === "tempo") { sons.mesa(); mesa(); } else fim();
    }, 1300);
  } else {
    travado = true;
    setTimeout(() => {
      if (!vale()) return;
      sons.erro();
      [x, y].forEach(c => c.b.classList.add("miss"));
      $("tip").className = "tip bad";
      $("tip").textContent = "Não é par. Tente lembrar onde estão as cartas!";
    }, 450);
    setTimeout(() => {
      if (!vale()) return;
      [x, y].forEach(c => { c.b.classList.remove("open", "miss"); c.b.setAttribute("aria-label", "Carta " + (c.i+1) + ", virada para baixo"); });
      if (modo === "2") vez = 1 - vez;
      travado = false; pinta();
    }, 1400);
    pinta();
  }
}

function fim(){
  clearInterval(relogio); relogio = null; acabou = true; travado = true;
  let festa = true;
  if (modo === "tempo") {
    const novoRecorde = achados > recorde;
    if (novoRecorde) { recorde = achados; try { localStorage.setItem("memoria-recorde-tempo", String(recorde)); } catch (e) {} }
    festa = novoRecorde;
    $("winTitle").textContent = novoRecorde ? "Novo recorde!" : "Tempo esgotado!";
    $("winText").textContent = "Você achou " + achados + (achados === 1 ? " par" : " pares") + " em " + LIMITE + " segundos. Recorde neste aparelho: " + recorde + ".";
  } else if (modo === "2") {
    $("winTitle").textContent = pontos[0] === pontos[1] ? "Empate!" : "Jogador " + (pontos[0] > pontos[1] ? 1 : 2) + " venceu!";
    $("winText").textContent = "Placar final: " + pontos[0] + " x " + pontos[1] + " pares.";
  } else {
    $("winTitle").textContent = "Parabéns, você achou todos os pares!";
    $("winText").textContent = "Foram " + jogadas + " jogadas em " + fmt(passados()) + ". Agora é praticar essas atitudes no dia a dia.";
  }
  pinta();
  $("win").hidden = false;
  if (festa) { sons.vitoria(); confete(0, 0, 180, true); } else sons.fimTempo();
  $("win").scrollIntoView({block:"nearest", behavior:"smooth"});
}

$("som").addEventListener("click", () => { som = !som; $("som").textContent = "Som: " + (som ? "ligado" : "desligado"); $("som").setAttribute("aria-pressed", String(som)); if (som) sons.acerto(); });
$("novo").addEventListener("click", novo);
$("novo2").addEventListener("click", novo);
$("modo1").addEventListener("click", () => { modo = "1"; novo(); });
$("modo2").addEventListener("click", () => { modo = "2"; novo(); });
$("modoT").addEventListener("click", () => { modo = "tempo"; novo(); });

$("galTitulo").textContent = "Banco de figuras (" + BANCO.length + " atitudes)";
$("gal").innerHTML = BANCO.map(t => '<div class="g" title="' + t.nome + '">' + frente(t, 0) + '</div>').join("");
novo();
</script>
